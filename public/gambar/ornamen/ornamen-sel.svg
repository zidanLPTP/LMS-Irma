<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Membran Sel Biologi Monokrom Outline -->
    <path d="M100 25 C155 20, 185 55, 180 105 C175 155, 145 180, 95 180 C45 180, 20 150, 25 95 C30 40, 55 25, 100 25 Z" opacity="0.9"/>
    <!-- Membran Ganda Lapisan Dalam -->
    <path d="M100 35 C145 30, 172 58, 168 100 C164 142, 138 168, 95 168 C52 168, 32 142, 36 95 C40 48, 62 35, 100 35 Z" opacity="0.3" stroke-dasharray="3 3"/>
    
    <!-- Nukleus (Inti Sel) & Nukleolus -->
    <circle cx="95" cy="95" r="32" opacity="0.8"/>
    <circle cx="95" cy="95" r="28" stroke-dasharray="2 3" opacity="0.4"/>
    <circle cx="98" cy="92" r="10" fill="currentColor" opacity="0.6"/>

    <!-- Mitokondria dengan Krista -->
    <ellipse cx="145" cy="70" rx="16" ry="9" transform="rotate(-30 145 70)"/>
    <path d="M135 68 Q145 65, 155 72" opacity="0.6"/>

    <!-- Vakuola / Badan Golgi -->
    <ellipse cx="55" cy="125" rx="14" ry="10" transform="rotate(20 55 125)"/>
    <path d="M130 125 Q145 135, 135 145" opacity="0.5"/>
    <path d="M125 132 Q140 142, 130 152" opacity="0.5"/>
    
    <!-- Ribosom Titik-titik Organel -->
    <circle cx="65" cy="65" r="2" fill="currentColor"/>
    <circle cx="75" cy="55" r="2" fill="currentColor"/>
    <circle cx="140" cy="105" r="2" fill="currentColor"/>
    <circle cx="70" cy="145" r="2" fill="currentColor"/>
</svg>
